<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15jahrevoraus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0D0F0E;
      color: #ffffff;
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 680px;
    }

    .logo {
      color: #7CFC6E;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(1.1rem, 3.5vw, 1.6rem);
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }

    .subline {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      font-weight: 400;
      color: #a0a0a0;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">15jahrevoraus</div>
    <h1>Das deutsche Bildungssystem optimiert für eine Arbeitswelt, die es in 15 Jahren nicht mehr gibt.</h1>
    <p class="subline">Wir brauchen kein Update. Wir brauchen ein Umdenken.</p>
  </div>
</body>
</html>
